{
  "special_projects": [
    "kubernetes / kubernetes",
    "grafana/grafana",
    "argoproj / argo-cd",
    "kubernetes-sigs / karpenter",
    "kubernetes-sigs / aws-load-balancer-controller",
    "aws / amazon-vpc-cni-k8s",
    "etcd-io / etcd",
    "istio / istio"
  ],
  "collector": {
    "per_page": 100,
    "max_incremental_pages_per_repo": 3,
    "max_incremental_pages_special_project": 5,
    "bootstrap_pages": 1,
    "known_only_pages_to_stop": 1,
    "global_budget_seconds": 900,
    "per_repo_budget_seconds": 60,
    "reconciliation_pages_per_repo": 2,
    "reconciliation_pages_special_project": 4,
    "max_reconciliation_repositories_per_run": 10,
    "reconciliation_shards": 8,
    "special_reconciliation_shards": 2
  },
  "notification": {
    "min_release_count": 5,
    "special_project_always_notify": true,
    "first_run_notify": false,
    "cutover_pending_policy": "suppress_existing",
    "max_slack_text_length": 35000
  },
  "feed": {
    "output_path": ".cache/release-feed.json"
  },
  "llm": {
    "enabled": false,
    "provider": "local",
    "role": "summarize_and_prioritize_only"
  },
  "intelligence": {
    "mode": "shadow",
    "registry_path": "config/projects.yaml",
    "advisories_enabled": true,
    "repository_advisories_enabled": false,
    "max_pages_per_source": 3,
    "budget_seconds": 120,
    "canary_projects": []
  },
  "analysis": {
    "enabled": false,
    "provider": "openai_compatible",
    "base_url_env": "LLM_BASE_URL",
    "api_key_env": "LLM_API_KEY",
    "model": "local-model",
    "timeout_seconds": 30,
    "max_retries": 1,
    "max_input_chars": 24000,
    "max_output_tokens": 1200,
    "prompt_version": "v1",
    "fail_open_to_fallback": true
  },
  "routing": {
    "policy_version": "v1",
    "destination_visibility": "private",
    "allow_ai_promotion": true,
    "critical": {
      "immediate": true
    },
    "high": {
      "immediate": true,
      "max_batch_size": 10
    },
    "digest": {
      "min_count": 5,
      "max_age_hours": 24,
      "send_hours_kst": [
        17
      ],
      "max_batch_size": 50
    }
  },
  "artifacts": {
    "inventory": {
      "enabled": false,
      "public_only": true
    },
    "release_feed": {
      "enabled": false,
      "public_only": true
    },
    "knowledge_export": {
      "enabled": false,
      "public_only": true
    }
  }
}
