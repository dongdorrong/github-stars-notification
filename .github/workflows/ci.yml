name: PR CI (no production secrets)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out untrusted PR code without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install hash-locked development dependencies
        run: python -m pip install --require-hashes -r .github/scripts/requirements-dev.txt

      - name: Check schemas, registry, Python, lock and secret shapes
        run: python scripts/check_contracts.py

      - name: Compile production and export scripts
        run: |
          python -m py_compile .github/scripts/check_release.py
          python -m compileall -q .github/scripts starwatch scripts

      - name: Lint Python
        run: ruff check --select E4,E7,E9,F .github/scripts starwatch scripts tests

      - name: Check formatting of new policy and CI contracts
        run: ruff format --check starwatch/routing.py tests/test_routing.py scripts/check_contracts.py tests/test_ci_contracts.py

      - name: Run token-free fixture tests
        run: python -m unittest discover -s tests -v

      - name: Audit pinned runtime and CI dependencies
        run: |
          pip-audit --disable-pip --progress-spinner off -r .github/scripts/requirements.txt
          pip-audit --disable-pip --progress-spinner off -r .github/scripts/requirements-dev.txt
