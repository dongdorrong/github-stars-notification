name: Notify Starred Releases
on:
  schedule:
    - cron: '0 23 * * *'  # 한국시간 08:00
    - cron: '0 5 * * *'   # 한국시간 14:00
    - cron: '0 8 * * *'   # 한국시간 17:00
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview는 읽기 전용; commit은 기본 브랜치에서만 상태 변경 및 Slack 전송'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - commit

permissions:
  contents: read

# Cache is not a transactional database. Serialize the entire restore/run/save window.
concurrency:
  group: github-stars-intelligence-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject commit mode outside the default branch
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'commit' || inputs.mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RUN_MODE" == commit && "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo 'Commit mode requires the default branch.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      # Old cache archives contain all of .cache. Restore them first so they
      # cannot replace a subsequently restored event DB. The legacy JSON is
      # read-only migration input; the new cache saves only events.sqlite3.
      - name: Restore legacy release cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: ${{ runner.os }}-releases-cache-legacy-readonly
          restore-keys: |
            ${{ runner.os }}-releases-cache-

      - name: Restore event DB
        uses: actions/cache/restore@v4
        with:
          path: .cache/events.sqlite3
          key: ${{ runner.os }}-intelligence-events-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-intelligence-events-v1-

      - name: List starred repos
        id: star
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p .cache
          gh api /user/starred --paginate \
            --jq '.[] | {full_name, description, html_url, language, topics, archived, disabled, fork, pushed_at, updated_at, stargazers_count, open_issues_count}' \
            > .cache/stars-inventory.jsonl
          jq -s 'sort_by(.full_name)' .cache/stars-inventory.jsonl \
            > .cache/stars-inventory.json
          jq -r '.[].full_name' .cache/stars-inventory.json \
            > repos.txt
          echo "repo_count=$(jq 'length' .cache/stars-inventory.json)" >> "$GITHUB_OUTPUT"

      - name: Preview releases (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        id: detect_preview
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python .github/scripts/check_release.py \
            --mode preview --state-db .cache/events.sqlite3

      - name: Collect and notify releases
        if: github.event_name == 'schedule' || inputs.mode == 'commit'
        id: detect_commit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python .github/scripts/check_release.py \
            --mode commit --state-db .cache/events.sqlite3 --send-slack

      # A Slack failure can leave retryable changes in a valid DB. Save it even
      # when the notifier exits nonzero; never publish a missing/corrupt DB.
      - name: Validate event DB before cache save
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'commit') && github.ref_name == github.event.repository.default_branch && steps.detect_commit.outcome != 'skipped'
        id: validate_state
        run: |
          python - <<'PY'
          from pathlib import Path
          from starwatch.event_store import EventStore

          path = Path('.cache/events.sqlite3')
          if not path.is_file():
              raise SystemExit('Event DB missing; cache not saved')
          try:
              EventStore.open(path, preview=True).close()
          except ValueError as exc:
              raise SystemExit(f'Event DB invalid; cache not saved: {exc}')
          PY

      - name: Save event DB
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'commit') && github.ref_name == github.event.repository.default_branch && steps.validate_state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/events.sqlite3
          key: ${{ runner.os }}-intelligence-events-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Do not upload inventory/feed artifacts: starred repositories may be
      # private. A sanitized artifact contract is out of P0 scope.
      - name: Summarize run
        if: always()
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'commit' || inputs.mode }}
          REPO_COUNT: ${{ steps.star.outputs.repo_count }}
          PREVIEW_RELEASE_COUNT: ${{ steps.detect_preview.outputs.release_count }}
          COMMIT_RELEASE_COUNT: ${{ steps.detect_commit.outputs.release_count }}
        run: |
          {
            echo '## GitHub starred release check'
            echo "- mode: $RUN_MODE"
            echo "- starred repos: ${REPO_COUNT:-unavailable}"
            echo "- releases (preview): ${PREVIEW_RELEASE_COUNT:-n/a}"
            echo "- releases (commit): ${COMMIT_RELEASE_COUNT:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"
