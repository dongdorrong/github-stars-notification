name: Notify Starred Releases
on:
  schedule:
    - cron: '0 23 * * *'  # 한국시간 08:00
    - cron: '0 5 * * *'   # 한국시간 14:00
    - cron: '0 8 * * *'   # 한국시간 17:00
  workflow_dispatch:
    inputs:
      send_slack:
        description: '정책 조건 충족 시 Slack 알림도 전송'
        required: false
        default: false
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.detect.outputs.has_new }}
      payloads: ${{ steps.detect.outputs.payloads }}
      message_count: ${{ steps.detect.outputs.message_count }}
      feed_path: ${{ steps.detect.outputs.feed_path }}
      release_count: ${{ steps.detect.outputs.release_count }}
      special_release_count: ${{ steps.detect.outputs.special_release_count }}
      notify_reason: ${{ steps.detect.outputs.notify_reason }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Cache release data
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-releases-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-releases-cache-
      
      - name: List starred repos
        id: star
        run: |
          mkdir -p .cache

          gh api /user/starred --paginate \
            --jq '.[] | {full_name, description, html_url, language, topics, archived, disabled, fork, pushed_at, updated_at, stargazers_count, open_issues_count}' \
            > .cache/stars-inventory.jsonl

          jq -s 'sort_by(.full_name)' .cache/stars-inventory.jsonl \
            > .cache/stars-inventory.json
          jq -r '.[].full_name' .cache/stars-inventory.json \
            > repos.txt

          echo "repo_count=$(jq 'length' .cache/stars-inventory.json)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Detect new releases
        id: detect
        run: python .github/scripts/check_release.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload starred inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starred-inventory
          path: |
            repos.txt
            .cache/stars-inventory.json
          if-no-files-found: error

      - name: Upload deterministic release feed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-feed
          path: ${{ steps.detect.outputs.feed_path || '.cache/release-feed.json' }}
          if-no-files-found: ignore

      - name: Summarize detection
        if: always()
        run: |
          {
            echo "## GitHub starred release check"
            echo "- starred repos: ${{ steps.star.outputs.repo_count }}"
            echo "- notify: ${{ steps.detect.outputs.has_new }}"
            echo "- reason: ${{ steps.detect.outputs.notify_reason }}"
            echo "- releases: ${{ steps.detect.outputs.release_count }}"
            echo "- special releases: ${{ steps.detect.outputs.special_release_count }}"
            echo "- feed: ${{ steps.detect.outputs.feed_path }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: check
    # 정기 실행은 기존대로 알림을 보내고, 수동 실행은 send_slack=true일 때만 보낸다.
    # 임시 push bootstrap 실행에서는 Slack을 전송하지 않는다.
    if: >-
      needs.check.outputs.has_new == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.send_slack == true))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.payloads || '[{}]') }}
    steps:
      - name: Send Slack Message
        env:
          # SECURITY: release title/name/url은 외부 저장소 관리자가 제어할 수 있다.
          # GitHub expression을 inline shell 문자열에 직접 넣으면 quote-break injection이 가능하므로
          # 반드시 env로 전달하고 run 블록에서는 double-quoted shell variable만 사용한다.
          SLACK_PAYLOAD: ${{ toJSON(matrix) }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Slack 메시지 전송 중..."
          
          # 메시지 순서에 따른 지연 (Rate limit 방지)
          MESSAGE_INDEX="${{ strategy.job-index }}"
          if [ ! -z "$MESSAGE_INDEX" ] && [ "$MESSAGE_INDEX" -gt 0 ]; then
            DELAY=$((MESSAGE_INDEX * 3))
            echo "${DELAY}초 대기 중... (Rate limit 방지)"
            sleep $DELAY
          fi
          
          echo "Payload 전송 중..."
          # check_release.py에서 이미 Slack 형식으로 준비된 데이터를 그대로 사용
          printf '%s' "$SLACK_PAYLOAD" | curl --fail --show-error --silent -X POST \
            -H "Content-Type: application/json" \
            -d @- \
            "$SLACK_WEBHOOK_URL"
          
          echo "메시지 전송 완료"
